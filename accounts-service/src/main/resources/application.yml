spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bankflow
    username: bf_user
    password: bf_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: accounts-group
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-components: always
  prometheus:
    metrics:
      export:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: BankFlow
    description: Motor de transferencias bancarias con idempotencia, auditoría y consistencia ACID
    version: 0.0.1-SNAPSHOT