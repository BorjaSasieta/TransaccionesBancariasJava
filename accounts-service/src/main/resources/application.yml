spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bankflow
    username: bf_user
    password: bf_pass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: accounts-group
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus